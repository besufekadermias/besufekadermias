<svg xmlns="http://www.w3.org/2000/svg" width="500" height="195" viewBox="0 0 500 195" role="img" aria-label="GitHub streak: 0 day current streak, 0 day longest streak, 0 total contributions">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .value { font-size: 28px; font-weight: 700; fill: #58a6ff; }
    .label { font-size: 14px; fill: #c9d1d9; }
    .sub   { font-size: 12px; fill: #8b949e; }
    .ring-number { font-size: 28px; font-weight: 700; fill: #ffffff; }
    .ring-label  { font-size: 14px; font-weight: 700; fill: #58a6ff; }
  </style>

  <rect x="0.5" y="0.5" width="499" height="194" rx="4.5" fill="#0d1117" stroke="#1f6feb"/>

  
    <g text-anchor="middle">
      <text x="83" y="88" class="value">0</text>
      <text x="83" y="122" class="label">Total Contributions</text>
      <text x="83" y="144" class="sub">Jan 1, 2024 - Present</text>
    </g>
  
    <g text-anchor="middle">
      <text x="417" y="88" class="value">0</text>
      <text x="417" y="122" class="label">Longest Streak</text>
      <text x="417" y="144" class="sub">No active streak</text>
    </g>

  <g text-anchor="middle">
    <circle cx="250" cy="80" r="36" fill="none" stroke="#58a6ff" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="202.19 24"
      transform="rotate(-70.90 250 80)"/>
    <path transform="translate(240 32) scale(0.85)" fill="#f0883e"
      d="M12 2C12 2 5 9 5 14.5 5 18.6 8.1 22 12 22s7-3.4 7-7.5c0-3-1.5-5-3-6.5-.3 2-1.2 3-2.5 3.5C14 8 13 4.5 12 2z"/>
    <text x="250" y="90" class="ring-number">0</text>
    <text x="250" y="146" class="ring-label">Current Streak</text>
    <text x="250" y="168" class="sub">No active streak</text>
  </g>
</svg>
