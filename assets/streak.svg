<svg xmlns="http://www.w3.org/2000/svg" width="500" height="195" viewBox="0 0 500 195" role="img" aria-label="GitHub streak: 32 day current streak, 33 day longest streak">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .value { font-size: 28px; font-weight: 700; fill: #58a6ff; }
    .label { font-size: 14px; fill: #c9d1d9; }
    .sub   { font-size: 12px; fill: #8b949e; }
    .ring-number { font-size: 28px; font-weight: 700; fill: #ffffff; }
    .ring-label  { font-size: 14px; font-weight: 700; fill: #58a6ff; }
  </style>

  <rect x="0.5" y="0.5" width="499" height="194" rx="4.5" fill="#0d1117" stroke="#1f6feb"/>

  <g text-anchor="middle">
    <circle cx="165" cy="80" r="36" fill="none" stroke="#58a6ff" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="202.19 24"
      transform="rotate(-70.90 165 80)"/>
    <path transform="translate(155 32) scale(0.85)" fill="#f0883e"
      d="M12 2C12 2 5 9 5 14.5 5 18.6 8.1 22 12 22s7-3.4 7-7.5c0-3-1.5-5-3-6.5-.3 2-1.2 3-2.5 3.5C14 8 13 4.5 12 2z"/>
    <text x="165" y="90" class="ring-number">32</text>
    <text x="165" y="146" class="ring-label">Current Streak</text>
    <text x="165" y="168" class="sub">Aug 22 - Sep 22</text>
  </g>

  <g text-anchor="middle">
    <text x="335" y="90" class="value">33</text>
    <text x="335" y="146" class="label">Longest Streak</text>
    <text x="335" y="168" class="sub">May 26 - Jun 27</text>
  </g>
</svg>
