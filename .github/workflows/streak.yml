name: Update streak card

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate streak card
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          # Add a GH_STATS_TOKEN secret (classic PAT, read:user scope) to
          # include private contributions. Falls back to the default token.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: node scripts/generate-streak.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || (git commit -m "chore: update streak card" && git push)
